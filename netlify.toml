[build]
  command = "npm run build"
  publish = "dist"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/career-research"
  to = "/.netlify/functions/career-research"
  status = 200
[[redirects]]
  from = "/api/career-coach"
  to = "/.netlify/functions/career-coach"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
