&lt;header class=&quot;top&quot;&gt;
  &lt;h1&gt;Career Garden — how it works&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;A job-search workspace that tracks applications, researches the interview process from public sources, builds a deadline-aware preparation plan, and rehearses answers. React/Vite SPA + Netlify Functions + Supabase, with an optional Gemini/Brave AI layer.&lt;/p&gt;
  &lt;div class=&quot;badges&quot;&gt;
    &lt;span class=&quot;badge ok&quot;&gt;npm test · 117/117 pass&lt;/span&gt;
    &lt;span class=&quot;badge ok&quot;&gt;npm run lint · clean&lt;/span&gt;
    &lt;span class=&quot;badge ok&quot;&gt;npm run build · success&lt;/span&gt;
    &lt;span class=&quot;badge warn&quot;&gt;docs: 8 test files (was 6)&lt;/span&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
  &lt;h2&gt;1 · The core loop — one job, four steps&lt;/h2&gt;
  &lt;div class=&quot;flow&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h4&gt;Track&lt;/h4&gt;&lt;p&gt;Save a job: company, role, stage, dates, links, notes. Six plant stages (Seed → New beginning), list &amp;amp; board views, activity log.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h4&gt;Research&lt;/h4&gt;&lt;p&gt;Authenticated fetch of the JD, catalogue + search discovery, polite crawl of allowlisted hosts, AI extraction of interview accounts. Sources stay &lt;em&gt;unreviewed&lt;/em&gt; until you confirm them.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h4&gt;Prepare&lt;/h4&gt;&lt;p&gt;Deadline-aware plan: timezone-aware slots, 15% buffer, dependency-greedy scheduler, bounded JD matching, direct learning links.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h4&gt;Practice&lt;/h4&gt;&lt;p&gt;Role-specific prompts, timer, dictation, self-review; optional AI coaching with quoted-evidence validation. Saved attempts feed back into the plan.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;code&gt;workflow.js → synchronizePreparation()&lt;/code&gt; is the single transition shared by job edits, research, and practice reviews. A planning failure &lt;strong&gt;never blocks saving&lt;/strong&gt; — it returns an actionable notice.&lt;/p&gt;

  &lt;h2&gt;2 · System architecture&lt;/h2&gt;
  &lt;div class=&quot;grid cols-3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Client (browser)&lt;/h3&gt;&lt;p&gt;React 19 SPA. Landing page, Google PKCE login, authenticated workspace. &lt;span class=&quot;mono&quot;&gt;src/AppNew.jsx&lt;/span&gt;, &lt;span class=&quot;mono&quot;&gt;src/career/*&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Storage&lt;/h3&gt;&lt;p&gt;Demo = browser localStorage. Cloud = Supabase &lt;span class=&quot;mono&quot;&gt;jobs&lt;/span&gt; table with optimistic &lt;span class=&quot;mono&quot;&gt;revision&lt;/span&gt; concurrency. &lt;span class=&quot;mono&quot;&gt;repository.js&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;API (Netlify Functions)&lt;/h3&gt;&lt;p&gt;Three authenticated endpoints. Vite serves them locally via &lt;span class=&quot;mono&quot;&gt;vite.config.js&lt;/span&gt;; &lt;span class=&quot;mono&quot;&gt;netlify.toml&lt;/span&gt; maps them in production.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h2&gt;3 · Request pipeline — POST /api/career-research&lt;/h2&gt;
  &lt;div class=&quot;pipe&quot;&gt;
    &lt;span class=&quot;node&quot;&gt;POST body&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node gate&quot;&gt;validateInput (size/length)&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node gate&quot;&gt;Bearer token → Supabase getUser&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node gate&quot;&gt;claim_career_research() quota (8/hr)&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node hi&quot;&gt;read JD (safe-source)&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node&quot;&gt;seed catalogue + Brave search&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node hi&quot;&gt;polite crawl (robots + rate limit)&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node hi&quot;&gt;Gemini extract accounts (exact-substring spans)&lt;/span&gt;&lt;span class=&quot;sep&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;node&quot;&gt;200 JSON (jd, sources, accounts, warnings)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#bcdcc6&quot;&gt;&lt;/span&gt;gate / boundary&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#ecd7ac&quot;&gt;&lt;/span&gt;honest partial states (no fabricated results)&lt;/span&gt;
  &lt;/div&gt;

  &lt;h2&gt;4 · Evidence &amp;amp; scheduling core (deterministic, no LLM)&lt;/h2&gt;
  &lt;div class=&quot;grid cols-2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;assembleProcessMap()&lt;/h3&gt;&lt;p&gt;Hard exclusions (wrong company, unread body, unapproved rights, private-source ownership, missing provenance), event-based freshness, dedup by independence group, separate variants, format-confirmation flags. Scores order evidence — &lt;strong&gt;not probabilities&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;schedulePreparation()&lt;/h3&gt;&lt;p&gt;Absolute timestamps, dependency DAG with cycle detection, buffer, per-slot &amp;amp; overall budget, prerequisite promotion, completed-task preservation, explicit &lt;span class=&quot;mono&quot;&gt;deferred[]&lt;/span&gt; work. Oversized mocks are deferred, never split silently.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;mono&quot;&gt;src/lib/prepEngine.js&lt;/span&gt; — rank weights &lt;code&gt;0.55 scope fit + 0.25 freshness + 0.20 source weight&lt;/code&gt;; &quot;historical&quot; begins at 365 days (UI heuristic, not a factual expiry).&lt;/p&gt;

  &lt;h2&gt;5 · Safety boundaries (verified in code)&lt;/h2&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Boundary&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;What it enforces&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;SSRF / DNS-rebinding&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;lib/safe-source.mjs&lt;/td&gt;&lt;td&gt;HTTPS-only, DNS resolved &amp;amp; pinned to socket, private/link-local IPv4 blocked, redirect host checks, size/time/content-type caps, X/Twitter blocked&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Evidence grounding&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;career-research.mjs:33&lt;/td&gt;&lt;td&gt;Extraction requires exact substring in source text, ≤25 words/source, capped accounts/stages&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Coaching quotes&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;career-coach.mjs:5&lt;/td&gt;&lt;td&gt;Quotes must appear verbatim in the answer; no fabricated evidence; labeled fallible&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Row-level security&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;202609080001_*.sql&lt;/td&gt;&lt;td&gt;Restrictive owner guard, revision trigger, persistent quota function, &lt;span class=&quot;mono&quot;&gt;anon&lt;/span&gt; revoked&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Legacy endpoint&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;research-role.mjs&lt;/td&gt;&lt;td&gt;Unauthenticated crawler returns &lt;strong&gt;410 Gone&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h2&gt;6 · Plan vs. reality&lt;/h2&gt;
  &lt;div class=&quot;grid cols-3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Specified (V1/V2 docs)&lt;/h3&gt;&lt;p&gt;Cross-language research, branching process graphs, trained extraction model, shared evidence store. Explicitly labeled design targets, not claims of deployment.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Shipped&lt;/h3&gt;&lt;p&gt;Deterministic evidence gating + dedup, dependency scheduler, four-step loop, authenticated research/coach/brief, SSRF-safe fetcher, RLS migration.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Honest states&lt;/h3&gt;&lt;p&gt;No config → labeled demo mode. Missing functions/config → visible warnings, never fabricated research. Unsupported role families → JD-based checklist.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Docs updated in this pass: &lt;span class=&quot;mono&quot;&gt;docs/workspace-release.md&lt;/span&gt; now reports 117 tests across 8 files (was &quot;71 across six&quot;).&lt;/p&gt;
&lt;/main&gt;
